# Cherry Studio Workflow Bugfix With Unit Tests

## Action

Follow the bugfix-with-unit-tests workflow:
1. Identify and fix the bug in the relevant service or utility file.
2. Update or add unit tests in the corresponding __tests__ directory to cover the bug scenario.
3. Run the test suite to validate the fix.
4. Commit both the implementation and test changes together.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: src/renderer/aiCore/services/listModels.ts, src/renderer/aiCore/services/__tests__/listModels.test.ts, src/main/data/services/AgentService.ts

